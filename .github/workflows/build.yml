name: Build Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release (v<version from clipper/__init__.py>)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path clipper/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build
        shell: pwsh
        run: |
          $failed = $false
          try { ./packaging/build_windows.ps1 *>&1 | Tee-Object -FilePath build.log }
          catch { "ERROR: $_" | Tee-Object -FilePath build.log -Append; $failed = $true }
          if ($failed) {
            # the log tail as an annotation, readable through the API
            $t = (Get-Content build.log -Tail 60) -join "%0A"
            Write-Host "::error title=Build failed::$t"
            exit 1
          }

      - name: Install, start and uninstall
        shell: pwsh
        run: |
          trap {
            $t = ((Get-Content test.log -Tail 40 -ErrorAction SilentlyContinue) + "ERROR: $_") -join "%0A"
            Write-Host "::error title=Install test failed::$t"
            exit 1
          }
          Start-Transcript test.log | Out-Null
          $setup = (Get-ChildItem dist\UbiClipper-Setup-*.exe).FullName
          Start-Process $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /CURRENTUSER /NORESTART /LOG=install.log" -Wait
          $app = "$env:LOCALAPPDATA\Programs\UbiClipper"
          if (-not (Test-Path "$app\python\pythonw.exe")) { Get-Content install.log -Tail 40; throw "not installed" }

          & "$app\python\python.exe" "$app\check_setup.py"
          if ($LASTEXITCODE) { throw "check_setup failed" }

          & "$app\python\python.exe" "packaging\test_gpu_download.py"
          if ($LASTEXITCODE) { throw "GPU download test failed" }

          # the window opens and keeps running, the way the Start menu starts it
          $p = Start-Process "$app\python\pythonw.exe" -ArgumentList "`"$app\app.py`"" -WorkingDirectory $app -PassThru
          Start-Sleep 30
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force shots | Out-Null
          $bmp.Save("shots\first_start.png")
          $log = "$env:USERPROFILE\.ubiclipper\logs\ubiclipper.log"
          if (Test-Path $log) { Get-Content $log }
          if ($p.HasExited) { throw "UbiClipper closed by itself (exit $($p.ExitCode))" }
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern "Traceback" -Quiet)) { throw "errors in the log" }
          Stop-Process $p.Id -Force
          Start-Sleep 3

          Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES" -Wait
          Start-Sleep 5
          if (Test-Path "$app\python") { throw "uninstall left files behind" }
          Write-Host "Install / start / uninstall OK"
          Stop-Transcript | Out-Null

      - name: Store package (test-signed install and start)
        shell: pwsh
        run: |
          trap { Write-Host "::error title=MSIX test failed::$_"; exit 1 }
          Import-Module Appx -UseWindowsPowerShell -WarningAction SilentlyContinue
          $msix = (Get-ChildItem dist\*.msix).FullName
          $copy = "$env:RUNNER_TEMP\test.msix"
          Copy-Item $msix $copy
          [xml]$m = (& tar.exe -xOf $copy AppxManifest.xml)
          $pub = $m.Package.Identity.Publisher
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $pub -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(2) -TextExtension @("2.5.29.19={text}")
          $pfx = "$env:RUNNER_TEMP\test.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString "x" -AsPlainText -Force) | Out-Null
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\LocalMachine\TrustedPeople -Password (ConvertTo-SecureString "x" -AsPlainText -Force) | Out-Null
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match "\\x64\\" } | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /fd SHA256 /f $pfx /p x $copy
          if ($LASTEXITCODE) { throw "signtool failed" }
          Add-AppxPackage $copy
          $pkg = Get-AppxPackage -Name $m.Package.Identity.Name
          if (-not $pkg) { throw "not installed" }
          Start-Process "shell:AppsFolder\$($pkg.PackageFamilyName)!UbiClipper"
          Start-Sleep 35
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force shots | Out-Null
          $bmp.Save("shots\store_start.png")
          $running = Get-Process pythonw -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "*WindowsApps*" }
          $log = "$env:USERPROFILE\.ubiclipper\logs\ubiclipper.log"
          if (Test-Path $log) { Get-Content $log -Tail 30 }
          if (-not $running) { throw "the Store app is not running after 35 s" }
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern "Traceback" -Quiet)) { throw "errors in the log" }
          $running | Stop-Process -Force
          Remove-AppxPackage $pkg.PackageFullName
          Write-Host "::notice title=Store package::installs and starts ($($pkg.PackageFullName))"

      - name: Share screenshots and test log (ci-shots branch)
        if: always()
        shell: pwsh
        run: |
          if (Test-Path test.log) {
            $t = (Get-Content test.log | Select-String -Pattern "\[(OK|!!|XX)\]|OK$|unpacked|whl" | ForEach-Object Line) -join "%0A"
            Write-Host "::notice title=Install test::$t"
          }
          if (-not (Test-Path shots)) { exit 0 }
          # a separate worktree, so the build output here stays untouched
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          $wt = Join-Path $env:RUNNER_TEMP "shots-wt"
          git worktree add -q --detach $wt
          Push-Location $wt
          git checkout -q --orphan ci-shots
          git rm -rqf .
          Copy-Item "$env:GITHUB_WORKSPACE\shots\*", "$env:GITHUB_WORKSPACE\test.log" . -ErrorAction SilentlyContinue
          git add -A
          git commit -qm "Screenshots of run $env:GITHUB_RUN_ID"
          git push -qf origin ci-shots
          Pop-Location

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ubiclipper-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.msix
            shots/
            install.log
            build.log
            test.log
          if-no-files-found: warn

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: UbiClipper ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: packaging/release_notes.md
          files: |
            dist/*.exe
            dist/*.zip
          generate_release_notes: true
